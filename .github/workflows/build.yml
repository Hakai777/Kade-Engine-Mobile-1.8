name: Build Kade Engine 1.8 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  HAXE_VERSION: "4.3.4"
  LIME_VERSION: "7.8.0"
  OPENFL_VERSION: "9.4.0"
  ANDROID_API_LEVEL: "33"
  ANDROID_BUILD_TOOLS: "33.0.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Instalar dependências básicas
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-8-jdk ant

      - name: Instalar Haxe
        run: |
          wget https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-linux64.tar.gz
          tar -xzf haxe-${HAXE_VERSION}-linux64.tar.gz
          sudo mkdir -p /usr/local/bin
          sudo cp -r haxe-${HAXE_VERSION}/haxe /usr/local/bin/haxe
          sudo cp -r haxe-${HAXE_VERSION}/haxelib /usr/local/bin/haxelib
          haxelib setup ~/.haxelib

      - name: Instalar bibliotecas Haxe
        run: |
          haxelib install lime ${LIME_VERSION}
          haxelib install openfl ${OPENFL_VERSION}
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install newgrounds
          haxelib install hxcpp
          haxelib install actuate
          haxelib run lime setup android --yes

      - name: Compilar APK
        run: |
          haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: KadeEngine-1.8-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
