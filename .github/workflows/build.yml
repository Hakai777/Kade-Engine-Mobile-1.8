name: Build Kade Engine 1.8 APK (Android SDK + NDK + Extension-WebM)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  HAXE_VERSION: "4.1.5"
  LIME_VERSION: "7.8.0"
  OPENFL_VERSION: "9.4.0"
  ANDROID_API_LEVEL: "33"
  ANDROID_BUILD_TOOLS: "33.0.2"
  ANDROID_NDK_VERSION: "21.4.7075529" # compatível com Java 8

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Instalar dependências básicas
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-8-jdk git python3

      - name: Instalar Haxe 4.1.5
        run: |
          wget https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-linux64.tar.gz
          tar -xzf haxe-${HAXE_VERSION}-linux64.tar.gz
          sudo mkdir -p /usr/local/bin
          sudo cp -r haxe-${HAXE_VERSION}/haxe /usr/local/bin/haxe
          sudo cp -r haxe-${HAXE_VERSION}/haxelib /usr/local/bin/haxelib
          haxelib setup ~/.haxelib

      - name: Instalar bibliotecas Haxe
        run: |
          haxelib install lime ${LIME_VERSION}
          haxelib install openfl ${OPENFL_VERSION}
          haxelib install flixel 4.8.1
          haxelib install hscript 2.5.0
          haxelib install hxcpp 4.3.2
          haxelib install lime-samples 7.0.0
          haxelib install flixel-tools 1.5.1
          haxelib install flixel-demos 3.2.0
          haxelib install flixel-templates 2.7.0
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui 2.5.0
          haxelib install polymod 1.3.1
          haxelib install newgrounds 1.2.0
          haxelib install actuate
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git
          haxelib git hxvm-luajit https://github.com/nebulazorua/hxvm-luajit
          haxelib git faxe https://github.com/uhrobots/faxe
          haxelib git extension-webm https://github.com/KadeDev/extension-webm

      - name: Rebuild extension-webm
        run: |
          lime rebuild extension-webm android

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          java-version: 8

      - name: Compilar APK
        run: |
          haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KadeEngine-1.8-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
