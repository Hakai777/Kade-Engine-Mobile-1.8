name: Android Build CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.1.5

      - name: Cache haxelib path
        uses: actions/cache@v4
        with:
          path: |
            %HAXELIB_ROOT%
          key: ${{ runner.os }}-android

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v2.0.2

      - name: Setup Java JDK
        uses: actions/setup-java@v2.3.1
        with:
          distribution: 'zulu'
          java-version: '8'

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r18b  # Alterado para r18b, compatível com hxcpp

      - name: Instalar libs Haxe
        run: |
          mkdir -p "%HAXELIB_ROOT%"
          haxelib setup "%HAXELIB_ROOT%"
          haxelib install lime 7.8.0 --quiet
          haxelib install openfl 9.4.0 --quiet
          haxelib install flixel 4.9.0 --quiet
          haxelib install hxcpp --quiet
          haxelib install flixel-tools --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons 2.10.0 --quiet
          haxelib install hscript --quiet
          haxelib git faxe https://github.com/uhrobots/faxe --quiet
          haxelib install polymod 1.3.1 --quiet
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --quiet
          haxelib git extension-webm https://github.com/KlavierGayming/extension-webm --quiet
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git
          haxelib install actuate

      - name: Configurar NDK r18b e Lime
        run: |
          export ANDROID_NDK_ROOT=$HOME/android-ndk-r18b
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_ROOT
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime config HXCPP_ARM64 true
          haxelib run lime config HXCPP_x86 true

      - name: Rebuild extension-webm
        run: haxelib run lime rebuild extension-webm android

      - name: Listar libs
        run: haxelib list

      - name: Build APK
        run: |
          haxelib run lime setup android
          haxelib run lime build android -final

      - uses: actions/upload-artifact@v4
        with:
          name: Android Build
          path: export/release/android/bin/app/build/outputs/apk/release
